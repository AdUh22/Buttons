<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/Christmas_styles.css">
        <title>Christmas Countdown</title>
    </head>

    <body onload="updateTime()">
        <h1>Aktuálne zostáva:</h1>
        <h2>Obrazok: Ostravské Vianoce 2026 Kudyznudy.cz</h2>
        <div class="container">
            <div class="countdowns">
                <div class="value">
                    <span id="dni">0</span>
                    <span id="hodin">0</span>
                    <span id="minut">0</span>
                    <span id="sekund">0</span>
                </div>
                <div class="label">
                    <span>Dní</span>
                    <span>hod.</span>
                    <span>min.</span>
                    <span>sek.</span>
                </div>

            </div>
        </div>
        <div id="end">Do Vianoc!</div>

        <div></div>
         <a href="index.html">
            <button>späť</button>
        </a>

        <script src="js/Christmas_countdown.js" defer></script>
    </body>
</html>
